version: "3.9"

services:
  web:
    build:
      target: builder
    volumes:
      - .:/project # Changed from /app to /project to match your Dockerfile WORKDIR
      - /project/node_modules # Changed from /app/node_modules
    command: sh -c "bun install && bun run server:watch"
    environment:
      - NODE_ENV=development
