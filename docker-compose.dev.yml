services:
  backend:
    image: oven/bun:1.3
    working_dir: /usr/src/app
    env_file:
      - ./.env
    environment:
      - NODE_ENV=development
    ports:
      - "${PORT}:${PORT}"
    volumes:
      # 1. Mount the entire root directory
      - .:/usr/src/app
      # 2. Prevent host node_modules from overwriting container node_modules
      - /usr/src/app/node_modules
    networks:
      - app
    depends_on:
      - surrealdb
    command: sh -c "bun install --frozen-lockfile && bun run dev:server"

  frontend:
    image: oven/bun:1.3
    working_dir: /usr/src/app
    environment:
      - NODE_ENV=development
    ports:
      - "5173:5173"
    volumes:
      # 1. Mount the entire root directory
      - .:/usr/src/app
      # 2. Prevent host node_modules from overwriting container node_modules
      - /usr/src/app/node_modules
    networks:
      - app
    command: sh -c "bun install --frozen-lockfile && bun run dev:client"
