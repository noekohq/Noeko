services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    env_file:
      - ./.env
    environment:
      - NODE_ENV=production
      # Override DB_HOST to use the Docker network service name
      - DB_HOST=surrealdb
      - DB_PORT=8000
    ports:
      - "${PORT}:${PORT}"
    networks:
      - app
    depends_on:
      surrealdb:
        condition: service_healthy
    restart: always

  surrealdb:
    # Use the base configuration from docker-compose.yml
    networks:
      - app
    restart: always
