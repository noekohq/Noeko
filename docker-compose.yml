services:
  surrealdb:
    image: surrealdb/surrealdb:v3.2.3
    env_file:
      - ./.env # Assuming .env is in the project root
    entrypoint:
      - /surreal
      - start
      - --user
      - $DB_USER
      - --pass
      - $DB_PASSWORD
      - rocksdb:///data/database.db
    ports:
      - "127.0.0.1:$DB_PORT:8000"
    healthcheck:
      test: ["CMD", "/surreal", "is-ready", "--endpoint", "http://localhost:8000"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    networks:
      - app
    volumes:
      # v3 cannot open the v2 RocksDB files in place. This is intentionally a new volume.
      - surrealdb_data_v3:/data
      - ./temp_backups:/transfers
    user: root
