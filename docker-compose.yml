version: "3.9"

services:
  surrealdb:
    image: surrealdb/surrealdb:latest
    env_file:
      - ./.env # Assuming .env is in the project root
    entrypoint:
      - /surreal
      - start
      - --user
      - $DB_USER
      - --pass
      - $DB_PASSWORD
      - file:///data/database.db # Updated to use file:// for clarity with volume path
    ports:
      - "$DB_PORT:8000"
    networks:
      - app
    volumes:
      - surrealdb_data:/data # Using the named volume
    user: root
  redis:
    image: redis:alpine
    env_file:
      - ./.env # Assuming .env is in the project root
    ports:
      - "$REDIS_PORT:6379" # Expose Redis port to your local machine for debugging
    networks:
      - app
    volumes:
      - redis_data:/data

  # web:
  #   build:
  #     context: .
  #     dockerfile: docker/Dockerfile
  #   env_file:
  #     - ./.env
  #   depends_on:
  #     - surrealdb
  #   ports:
  #     - $PORT:$PORT
  #   networks:
  #     - app
  #   command: sh -c "bun run start"

networks:
  app:
    driver: bridge

volumes:
  surrealdb_data:
    driver: local
  redis_data:
    driver: local
