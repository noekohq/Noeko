services:
  surrealdb:
    # Keep the runtime on SurrealDB v2 until the app is migrated intentionally to v3.
    image: surrealdb/surrealdb:v2
    env_file:
      - ./.env # Assuming .env is in the project root
    entrypoint:
      - /surreal
      - start
      - --user
      - $DB_USER
      - --pass
      - $DB_PASSWORD
      - file:///data/database.db # Updated to use file:// for clarity with volume path
    ports:
      - "127.0.0.1:$DB_PORT:8000"
    networks:
      - app
    volumes:
      - surrealdb_data:/data # Using the named volume
      - ./temp_backups:/transfers
    user: root
