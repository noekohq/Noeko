<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Constellation renderer benchmark</title>
    <style>
      html,
      body,
      main {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #11151d;
      }

      canvas {
        position: absolute;
        inset: 0;
      }

      #labels {
        pointer-events: none;
      }

      output {
        position: absolute;
        z-index: 1;
        top: 12px;
        left: 12px;
        padding: 8px 10px;
        border-radius: 6px;
        color: #dce7f8;
        background: rgb(11 15 22 / 82%);
        font: 12px/1.5 ui-monospace, monospace;
        white-space: pre;
      }
    </style>
  </head>
  <body>
    <main>
      <canvas id="graph"></canvas>
      <canvas id="labels"></canvas>
      <output id="result">Preparing benchmark…</output>
    </main>
    <script type="module" src="./constellation-renderer.ts"></script>
  </body>
</html>
